<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180" viewBox="0 0 800 180" fill="none" role="img" aria-label="getsite.my">
  <title>getsite.my — dark background version, G rebuilt as a website</title>
  <!-- Icon: rounded square lifted off black with lighter slate + border -->
  <rect x="8" y="16" width="148" height="148" rx="40" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <!-- G body: the letter itself carries the website parts -->
  <path d="M 111 76 C 105 65, 95 58, 83 58 C 64 58, 49 73.5, 49 93 C 49 112.5, 64 128, 83 128 C 99 128, 111 118, 114 104" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- G crossbar as a green CTA button pill -->
  <path d="M 83 104 H 114" stroke="#4ADE80" stroke-width="13" stroke-linecap="round"/>
  <!-- Browser window dots pierced into the top band of the G -->
  <circle cx="66" cy="62.8" r="3.5" fill="#1E293B"/>
  <circle cx="79" cy="58.9" r="3.5" fill="#1E293B"/>
  <circle cx="92" cy="59.6" r="3.5" fill="#1E293B"/>
  <!-- .my dot -->
  <circle cx="124" cy="132" r="9.5" fill="#4ADE80"/>
  <!-- Wordmark for dark backgrounds: white + bright green for maximum contrast on black -->
  <text x="176" y="124" font-family="Inter, Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', Arial, sans-serif" font-size="86" font-weight="900" letter-spacing="-1.2" fill="#FFFFFF">getsite<tspan fill="#4ADE80">.my</tspan></text>
</svg>
