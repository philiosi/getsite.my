<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>getsite — 고르면 바로 보이는 내 사이트</title>
<meta name="description" content="사이트를 눈으로 고르세요. 고른 구성으로 샘플을 먼저 만들어 드리고, 보고 결정하시면 됩니다.">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f3efe7">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Noto+Serif+KR:wght@300;500&family=Outfit:wght@700&display=swap">
<link rel="stylesheet" href="./v3.css">
<link rel="stylesheet" href="./scenes/scenes.css">
<link rel="stylesheet" href="./gallery/layouts.css">
<link rel="modulepreload" href="./app.js">
</head>
<body>
<div class="app" id="app">

  <header class="bar">
    <a class="bar-mark" href="./">getsite</a>
    <p class="bar-line">고르면 바로 보입니다. 샘플을 먼저 받고 결정하세요.</p>
    <p class="bar-note"><span>이미지와 문구는 샘플</span><span class="bar-price">기본 50만 원 · VAT 별도</span></p>
  </header>

  <main class="stage" id="stage" aria-label="구성 미리보기">
    <div class="track" id="track">
      <section class="page page-scene" id="page-scene" aria-label="첫 장면">
        <div class="scene-host" id="scene-host"></div>
      </section>
      <section class="page page-gallery" id="page-gallery" aria-label="갤러리">
        <header class="page-head"><h2 id="gallery-title"></h2><p id="gallery-hint"></p></header>
        <div class="gallery-host" id="gallery-host"></div>
      </section>
      <section class="page page-close" id="page-close" aria-label="소개와 문의">
        <header class="page-head"><h2 id="close-site"></h2><p>소개와 문의</p></header>
        <div class="close-grid">
          <figure class="close-photo"><img id="close-img" alt=""></figure>
          <div class="close-copy">
            <h2 id="close-tagline"></h2>
            <p class="close-about" id="close-about"></p>
            <p class="close-contact"><span id="close-contact"></span><a id="close-mail" inert tabindex="-1">hello@example.com</a></p>
          </div>
        </div>
      </section>
    </div>
    <nav class="pager" id="pager" aria-label="미리보기 위치">
      <button type="button" data-view="scene" aria-label="첫 장면 보기"></button>
      <button type="button" data-view="gallery" aria-label="갤러리 보기"></button>
      <button type="button" data-view="close" aria-label="소개와 문의 보기"></button>
    </nav>
  </main>

  <div class="tray" id="tray" hidden role="dialog" aria-label="선택지"></div>

  <nav class="capsule" id="capsule" aria-label="구성 고르기">
    <button type="button" class="chip" data-tray="concept" aria-expanded="false"><span class="chip-k">컨셉</span><span class="chip-v" data-value="concept"></span></button>
    <button type="button" class="chip" data-tray="scene" aria-expanded="false"><span class="chip-k">첫 장면</span><span class="chip-v" data-value="scene"></span></button>
    <button type="button" class="chip" data-tray="gallery" aria-expanded="false"><span class="chip-k">갤러리</span><span class="chip-v" data-value="gallery"></span></button>
    <button type="button" class="cta" id="cta"><span class="cta-long">이 구성으로 샘플 받기</span><span class="cta-short">샘플 받기</span></button>
  </nav>

  <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title"></aside>
</div>
<noscript><p class="noscript">이 페이지는 미리보기를 위해 JavaScript가 필요합니다. 문의: getsite.yours@gmail.com</p></noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
